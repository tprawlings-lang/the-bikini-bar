<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720">
<!-- THE BIKINI BAR by DESERT TIDE — primary lockup (vector)
     Colors: pink #FF4FA3 · gold #D4AF37 · palm green #0F3D2E · sage #6F8F6B
     Fonts: Selima (script, self-hosted; fallback Sacramento) · Montserrat (caps)
     Convert text to outlines before print/embroidery use. -->
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Sacramento&amp;display=swap');
.script { font-family: 'Selima','Sacramento',cursive; fill:#FF4FA3; }
.caps   { font-family: 'Montserrat',sans-serif; font-weight:700; fill:#FF4FA3; }
.tag    { font-family: 'Montserrat',sans-serif; font-weight:500; fill:#0F3D2E; }
.gold   { stroke:#D4AF37; fill:none; stroke-linecap:round; }
.pinkln { stroke:#FF4FA3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.palm   { stroke:#0F3D2E; fill:none; stroke-linecap:round; stroke-linejoin:round; }
</style>
<path id="tagArc" d="M 139 415 A 200 200 0 0 0 501 415" fill="none"/>
</defs>
<!-- gold ring (open at top-right for the palm) -->
<path class="gold" stroke-width="4" d="M 419 117 A 235 235 0 1 0 533 231" />
<!-- palm tree -->
<g class="palm" stroke-width="5">
  <!-- trunk -->
  <path d="M 492 268 C 500 220 510 180 530 142" stroke="#D4AF37"/>
  <path d="M 506 268 C 514 222 522 184 540 148" stroke="#D4AF37"/>
  <line x1="497" y1="246" x2="511" y2="249" stroke="#D4AF37" stroke-width="3.5"/>
  <line x1="502" y1="222" x2="516" y2="226" stroke="#D4AF37" stroke-width="3.5"/>
  <line x1="508" y1="198" x2="521" y2="203" stroke="#D4AF37" stroke-width="3.5"/>
  <line x1="515" y1="174" x2="528" y2="180" stroke="#D4AF37" stroke-width="3.5"/>
  <!-- fronds -->
  <path d="M 535 140 C 500 110 460 100 420 108 C 462 116 498 132 535 140 Z" fill="#0F3D2E" stroke="none"/>
  <path d="M 535 140 C 505 98 472 78 432 72 C 470 92 506 116 535 140 Z" fill="#6F8F6B" stroke="none"/>
  <path d="M 535 140 C 528 96 540 58 568 32 C 548 70 540 106 535 140 Z" fill="#0F3D2E" stroke="none"/>
  <path d="M 535 140 C 566 102 604 86 640 88 C 602 102 566 122 535 140 Z" fill="#6F8F6B" stroke="none"/>
  <path d="M 535 140 C 572 124 610 124 638 138 C 602 138 566 140 535 140 Z" fill="#0F3D2E" stroke="none"/>
  <path d="M 535 140 C 568 152 594 174 606 204 C 580 180 556 160 535 140 Z" fill="#0F3D2E" stroke="none"/>
  <!-- coconuts -->
  <circle cx="528" cy="148" r="7" fill="#D4AF37" stroke="none"/>
  <circle cx="544" cy="152" r="7" fill="#D4AF37" stroke="none"/>
</g>
<!-- wordmark -->
<text class="caps" x="320" y="170" font-size="30" letter-spacing="14" text-anchor="middle">THE</text>
<text class="script" x="320" y="295" font-size="132" text-anchor="middle">Bikini</text>
<text class="caps" x="320" y="384" font-size="64" letter-spacing="26" text-anchor="middle">BAR</text>
<!-- bikini icon, bottom left -->
<g class="pinkln" stroke-width="5" transform="translate(68,94) scale(0.58)">
  <!-- halter strings -->
  <path d="M 150 430 C 158 452 166 470 172 484"/>
  <path d="M 214 430 C 206 452 198 470 192 484"/>
  <circle cx="182" cy="427" r="5"/>
  <!-- top cups -->
  <path d="M 146 492 C 154 470 170 460 182 472 C 176 488 164 498 150 500 Z"/>
  <path d="M 218 492 C 210 470 194 460 182 472 C 188 488 200 498 214 500 Z"/>
  <path d="M 150 500 L 132 506"/>
  <path d="M 214 500 L 232 506"/>
  <!-- bottom -->
  <path d="M 138 530 L 226 530 C 218 556 200 574 182 580 C 164 574 146 556 138 530 Z"/>
  <!-- side ties -->
  <path d="M 132 526 C 122 518 118 530 128 534 C 118 538 122 548 132 540"/>
  <path d="M 232 526 C 242 518 246 530 236 534 C 246 538 242 548 232 540"/>
</g>
<!-- star charm, bottom right -->
<g class="gold" stroke-width="5" transform="translate(184,140) scale(0.6)">
  <path d="M 452 420 C 452 436 452 448 452 458"/>
  <circle cx="452" cy="414" r="7"/>
  <path d="M 452 458 L 462 480 L 486 483 L 469 500 L 473 524 L 452 512 L 431 524 L 435 500 L 418 483 L 442 480 Z"/>
</g>
<!-- tagline on arc -->
<text class="tag" font-size="18" letter-spacing="4.5">
  <textPath href="#tagArc" startOffset="50%" text-anchor="middle">CUSTOMIZE. MIX. MATCH. SHINE.</textPath>
</text>
<!-- by Desert Tide -->
<text class="script" x="320" y="628" font-size="46" text-anchor="middle">by</text>
<line class="gold" x1="108" y1="672" x2="166" y2="672" stroke-width="3"/>
<text class="caps" x="320" y="680" font-size="24" letter-spacing="10" text-anchor="middle">DESERT TIDE</text>
<line class="gold" x1="474" y1="672" x2="532" y2="672" stroke-width="3"/>
</svg>
