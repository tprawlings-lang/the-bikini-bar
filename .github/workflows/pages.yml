name: Deploy to GitHub Pages

# Pages serves from the gh-pages branch; this mirrors the working branch
# into gh-pages on every push so the live site stays current.

on:
  push:
    branches: ["claude/lucid-planck-wj94co", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin "HEAD:gh-pages" --force
